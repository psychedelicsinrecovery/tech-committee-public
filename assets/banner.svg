    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#9373ce" font-size="15" font-weight="700" letter-spacing=".6">PIR® · Psychedelics In Recovery™</text><text x="56" y="122.2" fill="#ede9fe" font-size="60" font-weight="700" letter-spacing="-.5">Tech Committee</text><text x="56" y="166.0" fill="#d0cbe3" font-size="23">Keeps the fellowship's technology running. No</text><text x="56" y="196.8" fill="#d0cbe3" font-size="23">coding is needed to serve.</text></g>
